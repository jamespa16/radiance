run_name: d256_L16_fm4_lr0.1

data:
  dataset: roneneldan/TinyStories
  text_column: text
  tokenizer: gpt2
  seq_len: 512
  num_workers: 4
  cache_dir: .cache/radiance/tokenized

model:
  d_model: 256
  head_dim: 64
  n_layers: 16
  loop_count: 1
  ffn_mult: 4.0
  ffn_depth: 2
  dropout: 0.0
  max_seq_len: 512

train:
  # Effective batch 32 x 512 = 16384 tokens/step, pinned so an arm that uses less memory is not
  # silently handed a bigger batch (docs/results.md caution 1). Micro-batch 16 keeps the widest
  # and deepest arms on the same setting as the cheapest.
  batch_size: 16
  grad_accum_steps: 2
  auto_batch_size: false
  lr: 0.1
  muon_lr: 0.02
  weight_decay: 0.01
  warmup_ratio: 0.04
  max_steps: 1500
  grad_clip: 1.0
  log_every: 100
  eval_every: 150
  eval_max_batches: 50
  save_every: 1000000
  output_dir: experiments/under-50m/lr2/ckpt/d256_L16_fm4_lr0.1
  seed: 42
  compile: true
  dtype: bf16

wandb:
  mode: disabled
