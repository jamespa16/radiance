[project]
name = "radiance"
version = "0.1.0"
description = "Experimental LLM training framework"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",
    "transformers>=4.40",
    "datasets>=2.19",
    "wandb>=0.17",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "numpy>=1.26",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]
eval = [
    "lm-eval>=0.4.5,<0.5",
]

[project.scripts]
radiance-train = "radiance.train:main"
radiance-generate = "radiance.generate:main"
radiance-sweep = "radiance.sweep:main"
radiance-serve = "radiance.serve:main"
radiance-eval = "radiance.eval_harness:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# pythonpath=["."] so tests can `from tests.conftest import ...` for shared constants; without it
# pytest's rootdir isn't on sys.path and only fixtures (not module-level names) are reachable.
pythonpath = ["."]
testpaths = ["tests"]
# Compiled-GPU regression tests; each pays an inductor compile. Skip with -m "not slow".
markers = ["slow: compiles a model (CUDA only)"]
