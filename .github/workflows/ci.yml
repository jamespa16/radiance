name: CI

# Fast, CPU-only suite. Runs on the same self-hosted box as gpu-tests.yml —
# there's only one runner, so this and any GPU test run queue behind each
# other rather than running in parallel. Excludes tests/test_compile.py
# (marked `slow`, CUDA-only) — that suite runs separately in gpu-tests.yml.
# Requires the runner to be online (unlike a GitHub-hosted runner, pushes get
# no CI signal while the box is off).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run test suite (excluding slow/CUDA-only tests)
        run: uv run --group dev pytest -m "not slow"
