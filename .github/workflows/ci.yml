name: CI

# Fast, CPU-only suite. Runs on a GitHub-hosted runner (unlike gpu-tests.yml, which needs the
# self-hosted GPU box) so every push/PR gets a CI signal regardless of whether that box is online.
# Excludes tests/test_compile.py (marked `slow`, CUDA-only) — that suite runs separately in
# gpu-tests.yml.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Run test suite (excluding slow/CUDA-only tests)
        run: uv run --group dev pytest -m "not slow"
