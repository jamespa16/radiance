# This sweep is to determine what are the best hyperparameters for releasing Radiance V1.
name: v1-tuning-v1

program: src/radiance/sweep.py
method: bayes
project: radiance

metric:
  name: val/loss
  goal: minimize

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--config"
  - "configs/v1.yaml"

parameters:
  train:
    parameters:
      tokens_per_param:
        value: 1
      lr:
        min: 1.0e-4
        max: 1.0e-1
        distribution: log_uniform_values
      embed_lr:
        min: 1.0e-4
        max: 1.0e-1
        distribution: log_uniform_values
      muon_lr:
        min: 0.005
        max: 0.03
        distribution: uniform
      weight_decay:
        min: 0.005
        max: 0.02
        distribution: uniform
