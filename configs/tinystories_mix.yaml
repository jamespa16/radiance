run_name: tinystories-mix

data:
  # Train on the weighted blend defined in dataset_mix.yaml (same directory) instead of a single
  # dataset. While dataset_mix is set, data.dataset is ignored. Every corpus in the mix shares
  # the tokenizer/seq_len/streaming/cache_dir below.
  dataset_mix: dataset_mix.yaml
  tokenizer: gpt2
  seq_len: 512
  num_workers: 4
  cache_dir: .cache/radiance/tokenized

model:
  d_model: 256
  head_dim: 64
  n_layers: 6
  loop_count: 1
  ffn_mult: 4.0
  ffn_depth: 3
  dropout: 0.03
  max_seq_len: 512

train:
  batch_size: 32
  lr: 3.0e-4
  weight_decay: 0.01
  warmup_ratio: 0.2
  max_steps: 1000
  grad_clip: 1.0
  log_every: 10
  eval_every: 50
  save_every: 100
  output_dir: checkpoints/tinystories_mix
  seed: 42
  device: auto
  compile: true
  dtype: bf16

wandb:
  project: radiance
  entity: null
  mode: online
