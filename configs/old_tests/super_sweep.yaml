# Sweep for Opus 5's massive change

program: src/radiance/sweep.py
method: bayes
project: radiance

metric:
  name: val/loss
  goal: minimize

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--config"
  - "configs/super.yaml"

parameters:
  model:
    parameters:
      d_model:
        values: [128, 192, 256, 384]
      head_dim:
        values: [32, 64]
      z_loss_weight:
        min: 1.0e-5
        max: 1.0e-3
        distribution: log_uniform_values
      ponder_weight:
        min: 1.0e-6
        max: 1.0e-1
        distribution: log_uniform_values
      halt_epsilon:
        min: 1.0e-3
        max: 1.0e-1
      moe_aux_loss_weight:
        min: 1.0e-4
        max: 1.0e-1
        distribution: log_uniform_values

  train:
    parameters:
      lr:
        min: 1.0e-4
        max: 1.0e-2
        distribution: log_uniform_values
      muon_lr:
        min: 1.0e-4
        max: 1.0e-1
        distribution: log_uniform_values
      muon_momentum: 
        min: 0.8
        max: 0.999
        distribution: uniform
      weight_decay:
        min: 1.0e-6
        max: 1.0e-1
        distribution: log_uniform_values
      wsd_decay_ratio:
        min: 1.0e-4
        max: 1.0e-1
        distribution: log_uniform_values
      

      
