# Post-training stage 2 (RLHF, human feedback): DPO on Anthropic/hh-rlhf.
#
#   radiance-train --config configs/post_training/dpo_hh_rlhf.yaml --set train.init_from=$SFT
#
# hh-rlhf ships chosen/rejected as whole "\n\nHuman: ...\n\nAssistant: ..." transcript strings
# that share every turn but the final assistant one; the DPO pipeline parses them into turns
# (dpo_data.parse_hh_transcript) and leaves the shared turns out of the loss mask, so only the
# last response carries the preference. Labels are human crowdworker preferences between two samples
# from Anthropic's own (2022) models, over helpfulness and harmlessness — 160k train / 8.5k test.
# Note it is partly red-teaming data: some prompts, and some *chosen* responses, are offensive.
#
# Same reference/init_from convention and the same LR caveat as dpo_ultrafeedback.yaml.

run_name: post-training-dpo-hh-rlhf

data:
  seq_len: 1024
  num_workers: 8

model:
  dropout: 0.0 # see dpo_ultrafeedback.yaml
  z_loss_weight: 0.0

dpo:
  enabled: true
  dataset: Anthropic/hh-rlhf
  eval_split: test
  beta: 0.1

train:
  init_from: null # --set train.init_from=<SFT checkpoint>
  inherit_model_config: true
  batch_size: 8
  grad_accum_steps: 8
  lr: 1.0e-4
  muon_lr: 2.0e-4
  warmup_ratio: 0.1
  max_steps: 2000
  log_every: 10
  eval_every: 100
  save_every: 250
  output_dir: checkpoints/post_training/dpo_hh_rlhf
  dtype: bf16

wandb:
  project: radiance
  mode: online
