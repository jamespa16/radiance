program: src/radiance/sweep.py
method: bayes
project: radiance

metric:
  name: val/loss
  goal: minimize

command:
  - ${env}
  - ${interpreter}
  - ${program}
  - "--config"
  - "configs/tinystories_moe.yaml"

parameters:
  model:
    parameters:
      n_experts:
        min: 4  # must stay >= moe_top_k's max (4) below, since moe_top_k can't exceed n_experts
        max: 8
        distribution: int_uniform
      moe_top_k:
        min: 2
        max: 4
        distribution: int_uniform
      moe_capacity_factor:
        min: 1.0
        max: 2.0
        distribution: uniform
      moe_aux_loss_weight:
        min: 1.0e-4
        max: 1.0e-1
        distribution: log_uniform_values
      moe_dense_every:
        min: 2
        max: 5
        distribution: int_uniform
      
  train:
    parameters:
      lr:
        min: 2.0e-3
        max: 4.0e-3
        distribution: log_uniform_values
      weight_decay:
        min: 1.0e-4
        max: 1.0e-2
        distribution: log_uniform_values
