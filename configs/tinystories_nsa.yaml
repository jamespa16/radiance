# Worked example: NSA-lite (DeepSeek Native Sparse Attention, simplified) learned block-sparse
# attention (model.use_nsa).
#
# Two branches replace plain dense/doc-masked attention: a coarse "compression" branch attends
# against mean-pooled blocks of raw K/V (cheap, always dense), and a fine "selection" branch
# attends only the top-k historical blocks a learned score picks *per query token* plus that
# token's own local block. A per-token gate combines the two. Unlike value_residual/attn_out_gate,
# there's no zero/identity init that makes a learned key-selection mechanism equivalent to dense
# attention, so this is opt-in (like use_moe/use_router/n_kv_heads), not default-on.
#
# Three things to know before using it:
#
#  * model.nsa_block_size must stay at 128 (the default) unless you've separately confirmed a
#    different value's flex_attention kernel actually compiles on your GPU. The selection branch's
#    BlockMask is built with BLOCK_SIZE=nsa_block_size, and flex_attention's Triton kernel only
#    accepts a BLOCK_SIZE that's a multiple of its own internal tile size (128, confirmed on this
#    repo's dev hardware) — a smaller value doesn't just run slower, it raises at the first
#    compiled forward.
#  * doc_attention_mask must be off (set explicitly below, unlike every other example config,
#    which leaves it on). NSA's compression branch mean-pools fixed-position blocks of raw K/V
#    with no document-boundary awareness, so a block straddling a packed-document join would blend
#    two documents together before any attention mask is applied.
#  * At this config's scale (max_seq_len 512, so only 4 blocks of 128), this is closer to a
#    correctness smoke test than a demonstration of speedup — NSA's benefit is compute *skipped*
#    at the flex_attention tile level, which only shows up once a sequence spans many blocks. A
#    real before/after wall-clock comparison needs a longer max_seq_len than TinyStories' default,
#    same caveat tinystories_act_sparse.yaml makes about short runs being dominated by compile and
#    data loading rather than model compute.

run_name: tinystories-nsa

data:
  dataset: roneneldan/TinyStories
  text_column: text
  tokenizer: gpt2
  seq_len: 512
  num_workers: 4
  cache_dir: .cache/radiance/tokenized

model:
  d_model: 256
  head_dim: 64
  n_layers: 6
  ffn_mult: 4.0
  ffn_depth: 2
  dropout: 0.0
  max_seq_len: 512

  doc_attention_mask: false  # required by use_nsa — see note above

  use_nsa: true
  nsa_block_size: 128        # don't shrink this — see note above
  nsa_top_k_blocks: 2        # plus the query's own always-included local block

train:
  batch_size: 32
  lr: 3.0e-4
  muon_lr: 0.02
  warmup_ratio: 0.2
  max_steps: 2000
  eval_every: 100
  save_every: 500
  output_dir: checkpoints/tinystories_nsa
  dtype: bf16

wandb:
  project: radiance
  mode: online
